<!DOCTYPE html>
<html lang="es">
  <head>
    <base href="/CrudActivity---Mini-OS/">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova OS - Invitado</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=SF+Pro+Display:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/media/apple-logo.svg" type="image/svg+xml" />

    <style>
        body {
            /* Forzar el fondo  */
            background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070') !important;
            background-size: cover !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            background-position: center !important;
        }
        
        /* Cambiar nombre de usuario en la barra */
        .username { visibility: hidden; position: relative; }
        .username::after {
            content: "Invitado";
            visibility: visible;
            position: absolute; left: 0; top: 0;
            color: white; font-weight: 600;
        }
    </style>
  </head>
  <body>
    <div class="desktop" id="desktop">
      <div class="menu-bar">
        <div class="menu-left">
          <div class="apple-menu">
            <span class="apple-logo"><i class="fab fa-apple"></i></span>
            <div class="apple-menu-dropdown">
              <div class="menu-item">Acerca de Nova OS</div>
              <div class="menu-item">Cerrar Sesión</div>
            </div>
          </div>
          <span class="app-menu">Finder</span>
          <span class="app-menu">Archivo</span>
          <span class="app-menu">Editar</span>
          <span class="app-menu">Ver</span>
          <span class="app-menu">Ir</span>
          <span class="app-menu">Ventana</span>
          <span class="app-menu">Ayuda</span>
        </div>
        <div class="menu-right">
          <span class="status-item"><i class="fas fa-wifi"></i></span>
          <span class="status-item"><i class="fas fa-volume-up"></i></span>
          <span class="status-item"><i class="fas fa-battery-three-quarters"></i> 87%</span
          >
          <span class="status-item" id="current-time">--:--</span>
          <span class="status-item" id="current-date">--- --</span>
          <span class="user-item">
            <i class="fas fa-user-circle"></i>
            <span class="username">Usuario</span>
          </span>
        </div>
      </div>

      <div class="quick-settings-panel hidden" id="quick-settings">
          <div class="quick-settings-header">
            <h3>Control Center</h3>
            <button class="quick-settings-close" onclick="toggleQuickSettings()"><i class="fas fa-times"></i></button>
          </div>
          </div>

      <div class="desktop-icons" id="desktop-icons">
        <div class="desktop-icon" id="doom-icon" onclick="abrirApp('Apps/doom/doom.html', 'Doom')">
          <div class="desktop-icon-img">
            <img src="assets/media/doom.png" alt="DOOM Icon" class="doom-icon-image" />
          </div>
          <span class="desktop-icon-label">DOOM</span>
        </div>
      </div>

      <div class="app-window-container" id="app-window-container">
        <div class="window-controls">
          <div class="control-btn close"></div>
          <div class="control-btn minimize"></div>
          <div class="control-btn maximize"></div>
          <span class="window-title" id="window-title">Bienvenido a Nova OS</span>
        </div>
        <iframe name="ventana-app" id="ventana-app" class="app-window" src="Apps/bienvenida/bienvenida.html"></iframe>
      </div>

      <div class="dock-container">
        <div class="dock" id="dock">
          <div class="dock-separator"></div>
          <a class="dock-item finder hidden" onclick="restoreWindow()" id="finder-icon">
            <div class="dock-icon"><i class="fas fa-window-restore"></i></div>
          </a>
          
          <a class="dock-item" onclick="abrirApp('Apps/calculator/calculator.html', 'Calculadora')">
            <div class="dock-icon"><i class="fas fa-calculator"></i></div>
          </a>
          <a class="dock-item" onclick="abrirApp('Apps/notas/notita.html', 'Bloc de Notas')">
            <div class="dock-icon"><i class="fas fa-sticky-note"></i></div>
          </a>
          <a class="dock-item" onclick="abrirApp('Apps/galery/image_gallery.html', 'Galería')">
            <div class="dock-icon"><i class="fas fa-images"></i></div>
          </a>
          <a class="dock-item" onclick="abrirApp('Apps/music/music.html', 'Música')">
            <div class="dock-icon"><i class="fas fa-music"></i></div>
          </a>
          <a class="dock-item" onclick="abrirApp('Apps/navegador/navegador.html', 'Navegador')">
            <div class="dock-icon"><i class="fas fa-globe"></i></div>
          </a>
          <a class="dock-item" onclick="abrirApp('Apps/juegos/juegos.html', 'Juegos')">
            <div class="dock-icon"><i class="fas fa-gamepad"></i></div>
          </a>
          <a class="dock-item" onclick="abrirApp('Apps/configuracion/configuracion.html', 'Configuración')">
            <div class="dock-icon"><i class="fas fa-cog"></i></div>
          </a>
          
          <div class="dock-separator"></div>
          
          <a class="dock-item trash" href="login.html" style="background: rgba(255,50,50,0.2);">
            <div class="dock-icon"><i class="fas fa-sign-out-alt"></i></div>
          </a>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
