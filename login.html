<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova OS - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="bg-layer bg-default"></div>
    <div class="bg-layer bg-connie"></div>
    <div class="bg-layer bg-guest"></div>

    <div class="screen" id="seleccion">
        <div class="users-container">
            <a href="#connie-pass" class="user-card">
                <div class="avatar" style="background-image: url('https://ui-avatars.com/api/?name=TM&background=00ff9d&color=000');"></div>
                <h3 class="user-name">Team Mocha</h3>
            </a>

            <a href="#guest-pass" class="user-card">
                <div class="avatar" style="background-image: url('https://ui-avatars.com/api/?name=IN&background=ff0055&color=fff');"></div>
                <h3 class="user-name">Invitado</h3>
            </a>
        </div>

        <div class="power-controls">
            <div class="power-btn"><i class="fas fa-power-off"></i> Apagar</div>
            <div class="power-btn" onclick="location.reload()"><i class="fas fa-redo"></i> Reiniciar</div>
            <div class="power-btn"><i class="fas fa-moon"></i> Suspender</div>
        </div>
    </div>

    <div class="screen password-screen" id="connie-pass">
        <div class="glass-card">
            <a href="#seleccion" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="avatar-small" style="background-image: url('https://ui-avatars.com/api/?name=TM&background=00ff9d&color=000');"></div>
            <h2>Team Mocha</h2>
            
            <input type="password" placeholder="Contraseña">
            
            <a href="index.html" class="login-submit-btn">
                ENTRAR AL SISTEMA <i class="fas fa-arrow-right"></i>
            </a>

            <p class="hint">Contraseña: admin123</p>
        </div>
    </div>

    <div class="screen password-screen" id="guest-pass">
        <div class="glass-card">
            <a href="#seleccion" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="avatar-small" style="background-image: url('https://ui-avatars.com/api/?name=IN&background=ff0055&color=fff');"></div>
            <h2>Invitado</h2>
            
            <input type="password" placeholder="Contraseña">

            <a href="index_guest.html" class="login-submit-btn">
                ENTRAR COMO INVITADO <i class="fas fa-arrow-right"></i>
            </a>

            <p class="hint">Sin contraseña</p>
        </div>
    </div>

</body>
</html>
